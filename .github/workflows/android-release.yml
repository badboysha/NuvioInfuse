name: ARM64 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      ANDROID_NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify build environment
        run: |
          java -version
          node --version
          npm --version
          rustc --version
          cargo --version
          rustup target list --installed
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found."
            exit 1
          fi

      - name: Grant Gradle permissions
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          elif [ -f androidApp/gradlew ]; then
            chmod +x androidApp/gradlew
          else
            echo "Gradle wrapper not found."
            exit 1
          fi

      - name: Build ARM64 Android APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew :androidApp:assembleRelease \
              --stacktrace \
              --info
          else
            cd androidApp
            ./gradlew :androidApp:assembleRelease \
              --stacktrace \
              --info
          fi

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-ARM64-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: ARM64
