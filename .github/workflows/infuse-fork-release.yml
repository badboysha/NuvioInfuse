name: Infuse Fork Release

# Builds an unsigned iOS IPA of NuvioMobile-Enhanced (luqmanfadlli/NuvioMobile-Enhanced, branch
# `enhanced`, which carries official Nuvio plus its own features) with the patches in /patches
# applied, and publishes it as a GitHub release (picked up by the Raspberry Pi release watcher).
# Checks every 6 hours and rebuilds when the Enhanced branch has moved. A change to /patches or
# this file also triggers a rebuild.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even if a release for this upstream release + patch set already exists
        type: boolean
        default: false
  schedule:
    - cron: "23 */6 * * *" # every 6 hours (hourly runs got Actions disabled on this fork)
  push:
    paths:
      - "patches/**"
      - ".github/workflows/infuse-fork-release.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: infuse-fork-release
  cancel-in-progress: false

env:
  SOURCE_REPO: luqmanfadlli/NuvioMobile-Enhanced
  SOURCE_BRANCH: enhanced

jobs:
  prepare:
    name: Check upstream release and decide
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      source_sha: ${{ steps.decide.outputs.source_sha }}
      upstream_tag: ${{ steps.decide.outputs.upstream_tag }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@v6

      # GitHub pauses scheduled workflows in repos with no commits for 60 days. This fork
      # otherwise never changes, so push an empty commit every ~45 days (it touches no watched
      # path, so it does not trigger a build).
      - name: Keep scheduled checks alive
        if: github.event_name == 'schedule'
        run: |
          last="$(git log -1 --format=%ct)"
          if (( $(date +%s) - last > 45 * 86400 )); then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: keep scheduled release checks enabled"
            git push
          fi

      - name: Decide whether to build
        id: decide
        run: |
          # Enhanced publishes no releases: build the tip of its branch.
          source_sha="$(gh api "repos/${SOURCE_REPO}/commits/${SOURCE_BRANCH}" --jq .sha)"
          [[ -n "${source_sha}" ]] || { echo "::error::Could not read ${SOURCE_REPO}@${SOURCE_BRANCH}."; exit 1; }
          upstream_tag="${SOURCE_BRANCH}@${source_sha::7}"
          version="$(gh api "repos/${SOURCE_REPO}/contents/iosApp/Configuration/Version.xcconfig?ref=${source_sha}" --jq .content \
            | base64 -d | sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]#]+).*$/\1/p' | head -n 1)"
          # Fingerprint of what this fork adds, so a patch or build change rebuilds but an
          # unrelated commit (like the keepalive) does not.
          fork_hash="$(cat patches/*.patch patches/BASE .github/workflows/infuse-fork-release.yml | sha256sum | cut -c1-7)"
          tag="v${version}-infuse.${source_sha::7}.${fork_hash}"
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Source: ${SOURCE_REPO} ${upstream_tag}, version ${version}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
             && [[ "${{ inputs.force }}" != "true" ]]; then
            echo "Release ${tag} already exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will build ${tag}."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build unsigned iOS IPA
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-15
    # Enhanced is a much bigger app than official Nuvio; its own release build allows 180 min.
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      # Same memory split as Enhanced's own iOS release build.
      KOTLIN_DAEMON_JVMARGS: -Xmx1024M
      NUVIO_GRADLE_JVMARGS: -Xmx2048M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M -XX:+UseG1GC
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx9216M -XX:+UseG1GC
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out this repo (patches)
        uses: actions/checkout@v6
        with:
          path: fork

      - name: Check out Enhanced source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: src
          fetch-depth: 0

      # The patches were made against the commit in patches/BASE. Each one is committed on top of
      # that commit (where it always applies), then the stack is rebased onto the commit being
      # built, so git merges them with real three-way merges instead of failing on shifted lines.
      # A patch upstream has since adopted drops out by itself. A real conflict cancels the run
      # (no failure email); the scheduled patch-update task resolves it and pushes new patches.
      - name: Apply fork patches
        id: apply
        working-directory: src
        run: |
          set -uo pipefail
          shopt -s nullglob
          git config user.name "fork-ci"; git config user.email "fork-ci@users.noreply.github.com"
          # Both upstream and the patches add strings at the end of strings.xml; keep both sides.
          mkdir -p "$(git rev-parse --git-dir)/info"
          echo '**/strings.xml merge=union' >> "$(git rev-parse --git-path info/attributes)"
          target="$(git rev-parse HEAD)"
          base="$(tr -d '[:space:]' < "../fork/patches/BASE" 2>/dev/null || true)"
          if [[ -z "${base}" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::patches/BASE is missing or unknown; applying the patches directly."
            base="${target}"
          fi
          git checkout -q -B patched "${base}"
          for patch in ../fork/patches/*.patch; do
            name="$(basename "${patch}")"
            if ! git apply --index "${patch}"; then
              echo "::error::${name} does not apply to its own base ${base::10}; patches/BASE is out of date."
              exit 1
            fi
            git commit -q --allow-empty -m "${name}"
          done
          if [[ "${base}" != "${target}" ]]; then
            if git rebase -q --empty=drop --onto "${target}" "${base}" patched; then
              echo "Rebased the patches from ${base::10} onto ${target::10}."
              git log --format='  %s' "${target}..patched"
            else
              conflict="$(git log -1 --format=%s REBASE_HEAD 2>/dev/null || echo unknown)"
              files="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git rebase --abort
              echo "::warning::${conflict} conflicts with the new source (${files}). Waiting for the patch-update task; cancelling this run."
              {
                echo "### Patches need updating"
                echo "\`${conflict}\` conflicts with ${target::10} in: ${files}"
                echo "The scheduled patch-update task will rebase the patches and push them; the next run then builds."
              } >> "${GITHUB_STEP_SUMMARY}"
              gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
              sleep 120
              exit 1
            fi
          fi
          # Build from the patched tree, as plain uncommitted changes on the target commit.
          git reset -q --soft "${target}"

      - name: Write runtime config
        env:
          # Official Nuvio server (Nuvio account + Nuvio Sync). These are the public client
          # values shipped inside every official Nuvio app (the key's role is "anon"), so they
          # are defaults here; set repository secrets with the same names to override them.
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL || 'https://api.nuvio.tv' }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL || 'https://api-two.nuvioapp.space' }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI' }}
          # Public feature endpoints the official Nuvio build ships with (IMDb episode ratings,
          # IntroDB skip-intro). Set repository secrets with the same names to override them.
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL || 'https://seriesgraph.com/' }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL || 'https://imdb.tapframe.space/' }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL || 'https://api.introdb.app/' }}
          # From repository secrets:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID || 'ESQBBlL7gpsyGj4a0rp5iInnxlVF7FvKE3BRPBdc' }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          : > src/local.properties
          for key in NUVIO_SUPABASE_URL NUVIO_SUPABASE_FALLBACK_URL NUVIO_SUPABASE_ANON_KEY \
                     IMDB_RATINGS_API_BASE_URL IMDB_TAPFRAME_API_BASE_URL INTRODB_API_URL \
                     TMDB_API_KEY SIMKL_CLIENT_ID MDBLIST_CLIENT_ID \
                     TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET; do
            value="${!key}"
            if [[ -n "${value}" ]]; then
              printf '%s=%s\n' "${key}" "${value}" >> src/local.properties
              echo "Set ${key}"
            else
              echo "Skipped ${key} (no secret)"
              # The app has no TMDB key entry any more: without this secret, artwork, logos and
              # cast from TMDB are off. Shown as a warning on the run, not just in the log.
              if [[ "${key}" == TMDB_API_KEY ]]; then
                echo "::warning title=TMDB key missing::Add a TMDB_API_KEY repository secret (themoviedb.org API key) or TMDB metadata is off in this build."
              fi
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      # Enhanced's build script no longer passes NUVIO_GRADLE_JVMARGS itself; write the limits
      # into Gradle's user properties, as Enhanced's own workflow does.
      - name: Constrain Gradle memory for the hosted runner
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          mkdir -p "${gradle_user_home}"
          {
            echo "org.gradle.jvmargs=${NUVIO_GRADLE_JVMARGS}"
            echo "kotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVMARGS}"
            echo "kotlin.native.jvmArgs=${NUVIO_KOTLIN_NATIVE_JVMARGS}"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=1"
            echo "kotlin.native.disableCompilerDaemon=true"
          } >> "${gradle_user_home}/gradle.properties"
          cat "${gradle_user_home}/gradle.properties"

      - name: Prepare iOS dependencies
        working-directory: src
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build IPA
        working-directory: src
        run: |
          set -o pipefail
          if ! ./scripts/build-ios-ipa.sh 2>&1 | tee build.log; then
            # Surface compile errors as annotations, readable without downloading the full log.
            grep -E "^e: |error: |\\.kt:[0-9]+:[0-9]+ |Unresolved reference" build.log | sort -u | head -40 \
              | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
            exit 1
          fi

      # Branches other than cmp-rewrite only test that the patches still build; their IPA is kept
      # as a run artifact instead of a release, so the Raspberry Pi never installs a test build.
      - name: Keep test build as an artifact
        if: github.ref_name != 'cmp-rewrite'
        uses: actions/upload-artifact@v4
        with:
          name: test-ipa
          path: src/build/ios-ipa/*.ipa
          retention-days: 7

      - name: Publish release
        if: github.ref_name == 'cmp-rewrite'
        run: |
          # Enhanced names the IPA nuvio-<version>-enhanced-<configuration>.ipa.
          src_ipa="$(ls src/build/ios-ipa/*.ipa 2>/dev/null | head -n 1)"
          dst="nuvio-${VERSION}-infuse-ios.ipa"
          if [[ ! -f "${src_ipa}" ]]; then
            echo "::error::Expected ${src_ipa} was not produced."
            ls -la src/build/ios-ipa || true
            exit 1
          fi
          mv "${src_ipa}" "${dst}"
          notes="NuvioMobile-Enhanced ${{ needs.prepare.outputs.upstream_tag }} (${{ needs.prepare.outputs.source_sha }}) with fork patches:"
          for patch in fork/patches/*.patch; do notes+=$'\n'"- $(basename "${patch}")"; done
          gh release create "${TAG}" "${dst}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${{ github.ref_name }}" \
            --title "Nuvio Enhanced ${VERSION} (Infuse fork)" \
            --notes "${notes}" \
            || gh release upload "${TAG}" "${dst}" --clobber --repo "${GITHUB_REPOSITORY}"
